<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="securityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景盾牌 -->
  <path d="M50,10 L20,25 L20,45 C20,65 35,85 50,90 C65,85 80,65 80,45 L80,25 Z"
        fill="url(#securityGradient)"
        opacity="0.1"
        stroke="url(#securityGradient)"
        stroke-width="2"/>

  <!-- 盾牌主体 -->
  <path d="M50,15 L25,28 L25,45 C25,63 38,80 50,85 C62,80 75,63 75,45 L75,28 Z"
        fill="url(#securityGradient)"
        opacity="0.2"
        filter="url(#shadow)"/>

  <!-- 锁体 -->
  <rect x="40" y="45" width="20" height="25" rx="3" fill="url(#securityGradient)" opacity="0.9"/>
  <circle cx="50" cy="45" r="10" fill="url(#securityGradient)" opacity="0.9"/>

  <!-- 钥匙孔 -->
  <circle cx="50" cy="45" r="3" fill="#ffffff"/>
  <rect x="48" y="45" width="4" height="8" fill="#ffffff" rx="1"/>

  <!-- 数据加密符号 -->
  <g transform="translate(30, 25)">
    <!-- 二进制数据 -->
    <circle cx="5" cy="5" r="2" fill="#ffffff"/>
    <circle cx="10" cy="10" r="2" fill="#ffffff"/>
    <circle cx="15" cy="5" r="2" fill="#ffffff"/>
    <circle cx="20" cy="10" r="2" fill="#ffffff"/>
    <circle cx="25" cy="5" r="2" fill="#ffffff"/>

    <!-- 锁链链接 -->
    <circle cx="35" cy="8" r="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="45" cy="8" r="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="39" y1="8" x2="41" y2="8" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- 检查标记 -->
  <path d="M35,65 L45,75 L60,55"
        stroke="#ffffff"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>

  <!-- 防护光环 -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#securityGradient)" stroke-width="1" stroke-dasharray="5,5" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- 数据块 -->
  <rect x="65" y="65" width="8" height="8" fill="#ffffff" opacity="0.7" rx="1"/>
  <rect x="75" y="65" width="8" height="8" fill="#ffffff" opacity="0.7" rx="1"/>
  <rect x="65" y="75" width="8" height="8" fill="#ffffff" opacity="0.7" rx="1"/>
  <rect x="75" y="75" width="8" height="8" fill="#ffffff" opacity="0.7" rx="1"/>

  <!-- 加锁数据流 -->
  <path d="M20,60 Q30,55 40,60 T60,55"
        stroke="#ffffff"
        stroke-width="1.5"
        fill="none"
        stroke-dasharray="3,3"
        opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="10" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>