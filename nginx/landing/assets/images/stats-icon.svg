<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="statsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="url(#statsGradient)" opacity="0.1"/>

  <!-- 正态分布曲线 -->
  <path d="M20,70 Q35,40 50,30 T80,70"
        stroke="url(#statsGradient)"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"/>

  <!-- 平均值线 -->
  <line x1="50" y1="20" x2="50" y2="80"
        stroke="#64748b"
        stroke-width="1"
        stroke-dasharray="3,3"
        opacity="0.5"/>

  <!-- 标准差区域 -->
  <path d="M40,50 Q45,45 50,45 T60,50 L60,70 Q55,75 50,75 T40,70 Z"
        fill="url(#statsGradient)"
        opacity="0.2"/>

  <!-- 数据点 -->
  <circle cx="30" cy="60" r="2.5" fill="#8b5cf6"/>
  <circle cx="35" cy="55" r="2.5" fill="#8b5cf6"/>
  <circle cx="40" cy="52" r="2.5" fill="#8b5cf6"/>
  <circle cx="45" cy="48" r="2.5" fill="#8b5cf6"/>
  <circle cx="50" cy="45" r="2.5" fill="#8b5cf6"/>
  <circle cx="55" cy="48" r="2.5" fill="#8b5cf6"/>
  <circle cx="60" cy="52" r="2.5" fill="#8b5cf6"/>
  <circle cx="65" cy="55" r="2.5" fill="#8b5cf6"/>
  <circle cx="70" cy="60" r="2.5" fill="#8b5cf6"/>

  <!-- 箱线图 -->
  <g transform="translate(20, 20)">
    <!-- 箱体 -->
    <rect x="0" y="10" width="25" height="30" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7"/>
    <!-- 中位数线 -->
    <line x1="0" y1="25" x2="25" y2="25" stroke="#10b981" stroke-width="2" opacity="0.7"/>
    <!-- 须线 -->
    <line x1="12.5" y1="10" x2="12.5" y2="5" stroke="#10b981" stroke-width="2" opacity="0.7"/>
    <line x1="12.5" y1="40" x2="12.5" y2="45" stroke="#10b981" stroke-width="2" opacity="0.7"/>
    <line x1="7.5" y1="5" x2="17.5" y2="5" stroke="#10b981" stroke-width="2" opacity="0.7"/>
    <line x1="7.5" y1="45" x2="17.5" y2="45" stroke="#10b981" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- 散点图 -->
  <circle cx="75" cy="30" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="80" cy="35" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="70" cy="40" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="75" cy="45" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="85" cy="40" r="3" fill="#ef4444" opacity="0.7"/>

  <!-- 回归线 -->
  <line x1="65" y1="25" x2="85" y2="45"
        stroke="#ef4444"
        stroke-width="2"
        opacity="0.7"
        stroke-dasharray="3,3"/>

  <!-- Σ 符号 -->
  <text x="85" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b5cf6" opacity="0.8">Σ</text>
</svg>