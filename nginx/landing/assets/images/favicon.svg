<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <circle cx="50" cy="50" r="45" fill="url(#faviconGradient)"/>

  <!-- 图表元素 -->
  <polyline points="30,60 45,40 60,50 75,30"
            stroke="#ffffff"
            stroke-width="5"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- 数据点 -->
  <circle cx="30" cy="60" r="3" fill="#ffffff"/>
  <circle cx="45" cy="40" r="3" fill="#ffffff"/>
  <circle cx="60" cy="50" r="3" fill="#ffffff"/>
  <circle cx="75" cy="30" r="3" fill="#ffffff"/>

  <!-- H字母（代表Hamster） -->
  <path d="M35,70 L35,80 M45,70 L45,80 M35,75 L45,75"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>