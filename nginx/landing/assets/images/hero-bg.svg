<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#gradient)"/>

  <!-- 数据点 -->
  <circle cx="200" cy="150" r="8" fill="#2563eb" opacity="0.3" filter="url(#blur)"/>
  <circle cx="400" cy="300" r="12" fill="#8b5cf6" opacity="0.3" filter="url(#blur)"/>
  <circle cx="600" cy="200" r="10" fill="#10b981" opacity="0.3" filter="url(#blur)"/>
  <circle cx="800" cy="400" r="14" fill="#2563eb" opacity="0.3" filter="url(#blur)"/>
  <circle cx="1000" cy="250" r="9" fill="#8b5cf6" opacity="0.3" filter="url(#blur)"/>

  <!-- 连接线 -->
  <path d="M200,150 L400,300 L600,200 L800,400 L1000,250"
        stroke="rgba(37, 99, 235, 0.2)"
        stroke-width="2"
        fill="none"
        stroke-dasharray="5,5"/>

  <!-- 图表元素 -->
  <polyline points="100,500 250,450 400,480 550,420 700,460 850,400 1000,440"
            stroke="#2563eb"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.4"/>

  <rect x="300" y="100" width="40" height="200" fill="#8b5cf6" opacity="0.4" rx="4"/>
  <rect x="400" y="150" width="40" height="150" fill="#10b981" opacity="0.4" rx="4"/>
  <rect x="500" y="80" width="40" height="220" fill="#2563eb" opacity="0.4" rx="4"/>
  <rect x="600" y="120" width="40" height="180" fill="#8b5cf6" opacity="0.4" rx="4"/>

  <!-- 网格线 -->
  <g stroke="rgba(100, 116, 139, 0.1)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>

    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
    <line x1="1100" y1="0" x2="1100" y2="600"/>
  </g>
</svg>