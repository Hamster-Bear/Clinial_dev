<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="url(#medicalGradient)" opacity="0.1"/>

  <!-- 十字标志 -->
  <rect x="45" y="30" width="10" height="40" rx="2" fill="url(#medicalGradient)"/>
  <rect x="30" y="45" width="40" height="10" rx="2" fill="url(#medicalGradient)"/>

  <!-- 心跳线 -->
  <polyline points="20,70 30,65 40,70 50,60 60,75 70,65 80,70"
            stroke="#ef4444"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.8"/>

  <!-- DNA双螺旋 -->
  <path d="M25,20 Q35,25 45,20 T65,25"
        stroke="#8b5cf6"
        stroke-width="2"
        fill="none"
        stroke-dasharray="3,3"
        opacity="0.7"/>
  <path d="M30,22 Q40,27 50,22 T70,27"
        stroke="#8b5cf6"
        stroke-width="2"
        fill="none"
        stroke-dasharray="3,3"
        opacity="0.7"/>

  <!-- 药丸 -->
  <rect x="70" y="20" width="20" height="10" rx="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="80" cy="25" r="5" fill="#3b82f6"/>

  <!-- 细胞 -->
  <circle cx="75" cy="70" r="8" fill="#f59e0b" opacity="0.6"/>
  <circle cx="80" cy="65" r="5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="70" cy="65" r="4" fill="#f59e0b" opacity="0.6"/>

  <!-- 统计图表 -->
  <rect x="20" y="80" width="8" height="15" fill="#10b981" opacity="0.7"/>
  <rect x="32" y="75" width="8" height="20" fill="#10b981" opacity="0.7"/>
  <rect x="44" y="70" width="8" height="25" fill="#10b981" opacity="0.7"/>
  <rect x="56" y="65" width="8" height="30" fill="#10b981" opacity="0.7"/>
</svg>