services:
  postgres:
    image: postgres:14-alpine
    container_name: hamster-analysis-postgres
    env_file:
      - .env.test
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"  # 宿主机测试端口
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotfl_user -d autotfl"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hamster-analysis-network

  redis:
    image: redis:7-alpine
    container_name: hamster-analysis-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - hamster-analysis-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autotfl-shiny-app:latest
    container_name: hamster-analysis-shiny
    env_file:
      - .env.test
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      STORAGE_ROOT: /app/data_storage
    volumes:
      - app_data_storage:/app/data_storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3838"
    restart: unless-stopped
    networks:
      - hamster-analysis-network

  nginx:
    image: nginx:1.27-alpine
    container_name: hamster-analysis-nginx
    depends_on:
      - app
    volumes:
      # 使用本地测试配置（包含landing页面）
      - ./nginx/local-test.conf:/etc/nginx/conf.d/default.conf:ro
      # 挂载landing页面文件到nginx容器
      - ./nginx/landing:/usr/share/nginx/html/landing:ro
    ports:
      - "8080:80"  # 本地访问端口 8080
    restart: unless-stopped
    networks:
      - hamster-analysis-network

networks:
  hamster-analysis-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data_storage:
    driver: local
