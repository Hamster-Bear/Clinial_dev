services:
  postgres:
    image: postgres:14-alpine
    container_name: autotfl-postgres
    environment:
      POSTGRES_DB: autotfl
      POSTGRES_USER: autotfl_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotfl_user -d autotfl"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autotfl-network

  # 保留：待后续业务集成
  redis:
    image: redis:7-alpine
    container_name: autotfl-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - autotfl-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autotfl-shiny-app:latest
    container_name: autotfl-shiny
    environment:
      POSTGRES_DB: autotfl
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: autotfl_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      STORAGE_ROOT: /app/data_storage
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    volumes:
      - app_data_storage:/app/data_storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3838"
    restart: unless-stopped
    networks:
      - autotfl-network

  nginx:
    image: nginx:1.27-alpine
    container_name: autotfl-nginx
    depends_on:
      - app
    volumes:
      # 默认代理配置 —— 不挂载 landing 页面，所有请求直通 Shiny
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"  # 本地开发端口，避免与宿主机 80 端口冲突
    restart: unless-stopped
    networks:
      - autotfl-network

networks:
  autotfl-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data_storage:
    driver: local
