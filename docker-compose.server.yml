name: hamster-analysis-server

services:
  postgres:
    image: postgres:14-alpine
    container_name: hamster-analysis-postgres
    environment:
      POSTGRES_DB: autotfl
      POSTGRES_USER: autotfl_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${DATA_ROOT:-/data/hamster-analysis}/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotfl_user -d autotfl"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hamster-analysis-network

  redis:
    image: redis:7-alpine
    container_name: hamster-analysis-redis
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_ROOT:-/data/hamster-analysis}/redis:/data
    restart: unless-stopped
    networks:
      - hamster-analysis-network

  app:
    image: autotfl-shiny-app:latest
    pull_policy: never
    container_name: hamster-analysis-shiny
    environment:
      POSTGRES_DB: autotfl
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: autotfl_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
      STORAGE_ROOT: ${APP_STORAGE_ROOT:-/app/data_storage}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    volumes:
      - ${DATA_ROOT:-/data/hamster-analysis}/storage:${APP_STORAGE_ROOT:-/app/data_storage}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3838"
    restart: unless-stopped
    networks:
      - hamster-analysis-network

  nginx:
    image: nginx:1.27-alpine
    container_name: hamster-analysis-nginx
    depends_on:
      - app
    volumes:
      - ./nginx/server_ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_ROOT:-/etc/hamster-analysis/certs}/${SSL_CERT_FILE:-kyyin.xyz.pem}:/etc/nginx/certs/kyyin.xyz.pem:ro
      - ${CERT_ROOT:-/etc/hamster-analysis/certs}/${SSL_KEY_FILE:-kyyin.xyz.key}:/etc/nginx/certs/kyyin.xyz.key:ro
      - ./nginx/landing:/usr/share/nginx/html/landing:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - hamster-analysis-network

networks:
  hamster-analysis-network:
    driver: bridge
